<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Redefinir senha | Login Seguro</title>
    <th:block th:replace="~{fragments/estilos :: estilos}"></th:block>
</head>
<body>
<main class="auth-container">
    <section class="card">
        <h1>Redefinir senha</h1>

        <div th:unless="${tokenValido}">
            <div class="alert alert-error" role="alert">
                Este link é inválido, expirou ou já foi utilizado.
            </div>

            <p>
                <a th:href="@{/esqueci-senha}">
                    Solicitar um novo link
                </a>
            </p>
        </div>

        <form th:if="${tokenValido}"
              th:action="@{/redefinir-senha}"
              th:object="${redefinicao}"
              method="post">

            <input type="hidden" th:field="*{token}">

            <div class="alert alert-error"
                 role="alert"
                 th:if="${#fields.hasErrors('*')}">
                <ul>
                    <li th:each="erro : ${#fields.errors('*')}"
                        th:text="${erro}">
                    </li>
                </ul>
            </div>

            <p id="regras-senha">
                Use de 8 a 64 caracteres, incluindo uma letra
                maiúscula, uma minúscula e um número.
            </p>

            <label for="senha">Nova senha</label>
            <input type="password"
                   id="senha"
                   name="senha"
                   minlength="8"
                   maxlength="64"
                   autocomplete="new-password"
                   aria-describedby="regras-senha"
                   required>

            <label for="confirmarSenha">Confirmar nova senha</label>
            <input type="password"
                   id="confirmarSenha"
                   name="confirmarSenha"
                   minlength="8"
                   maxlength="64"
                   autocomplete="new-password"
                   required>

            <button type="submit">Salvar nova senha</button>
        </form>

        <p>
            <a th:href="@{/login}">Voltar para o login</a>
        </p>
    </section>
</main>
</body>
</html>
