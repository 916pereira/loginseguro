<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Login Seguro</title>
    <th:block th:replace="~{fragments/estilos :: estilos}"></th:block>
</head>
<body>
<main class="auth-container">
    <section class="card">
        <h1>Login Seguro</h1>
        <p>Entre com seu e-mail e senha.</p>

        <div class="alert alert-error"
             role="alert"
             th:if="${param.erro}">
            E-mail ou senha inválidos.
        </div>

        <div class="alert alert-success"
             role="status"
             th:if="${param.cadastro}">
            Cadastro realizado! Você já pode entrar.
        </div>

        <div class="alert alert-success"
             role="status"
             th:if="${param.logout}">
            Você saiu da sua conta.
        </div>

        <div class="alert alert-success"
             role="status"
             th:if="${param.senhaRedefinida}">
            Senha redefinida! Entre com sua nova senha.
        </div>

        <form th:action="@{/login}" method="post">
            <label for="email">E-mail</label>
            <input type="email"
                   id="email"
                   name="email"
                   maxlength="254"
                   autocomplete="username"
                   required>

            <label for="senha">Senha</label>
            <input type="password"
                   id="senha"
                   name="senha"
                   autocomplete="current-password"
                   required>

            <button type="submit">Entrar</button>
        </form>

        <p>
            <a th:href="@{/esqueci-senha}">Esqueceu a senha?</a>
        </p>

        <p>
            Não tem uma conta?
            <a th:href="@{/cadastro}">Cadastre-se</a>
        </p>
    </section>
</main>
</body>
</html>
